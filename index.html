<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Sistem Pengurusan Aset Alih - Seksyen Biokimia VRI Ipoh</title>
<style>
:root{
  --navy:#1F3864; --navy-dark:#14294A; --navy-light:#2E5090;
  --bg:#F4F6F9; --card:#FFFFFF; --border:#E2E6ED; --text:#1D2733; --muted:#6B7686;
  --green:#1E8E5A; --green-bg:#E6F4EC;
  --red:#C0392B; --red-bg:#FBEAE8;
  --orange:#B9770E; --orange-bg:#FCF1DE;
  --grey:#6B7280; --grey-bg:#EEF0F3;
  --blue:#2563AB; --blue-bg:#E7EFFA;
  --purple:#7E3F98; --purple-bg:#F1E7F5;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;height:100%;background:var(--bg);color:var(--text);
  font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;font-size:14px;}
#app{min-height:100vh;}
button{font-family:inherit;cursor:pointer;}
input,select,textarea{font-family:inherit;font-size:14px;}

/* ---- Login ---- */
.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(135deg,var(--navy-dark),var(--navy-light));}
.login-card{background:#fff;border-radius:12px;padding:36px 40px;width:380px;box-shadow:0 20px 50px rgba(0,0,0,.25);}
.login-card h1{font-size:18px;color:var(--navy);margin:0 0 4px;}
.login-card .sub{color:var(--muted);font-size:12.5px;margin-bottom:22px;}
.login-card label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin:14px 0 5px;}
.login-card input,.login-card select{width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:7px;}
.login-card button.primary{width:100%;margin-top:20px;background:var(--navy);color:#fff;border:none;
  padding:11px;border-radius:7px;font-weight:600;font-size:14px;}
.login-card button.primary:hover{background:var(--navy-light);}
.login-err{background:var(--red-bg);color:var(--red);padding:8px 10px;border-radius:6px;font-size:12.5px;margin-top:12px;}
.login-hint{margin-top:18px;font-size:11.5px;color:var(--muted);background:#F8F9FB;border:1px dashed var(--border);
  border-radius:7px;padding:10px 12px;line-height:1.5;}

/* ---- Shell ---- */
.shell{display:flex;min-height:100vh;}
.sidebar{width:230px;background:var(--navy-dark);color:#dfe6f2;flex-shrink:0;display:flex;flex-direction:column;}
.sidebar .brand{padding:18px 18px 14px;border-bottom:1px solid rgba(255,255,255,.08);}
.sidebar .brand b{color:#fff;font-size:14.5px;display:block;}
.sidebar .brand span{font-size:11px;color:#9fb0cc;}
.sidebar nav{flex:1;overflow-y:auto;padding:10px 0;}
.navgroup-label{font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:#7c8db3;padding:14px 18px 6px;}
.navitem{display:flex;align-items:center;gap:9px;padding:9px 18px;color:#cfd9ec;text-decoration:none;font-size:13.3px;
  cursor:pointer;border-left:3px solid transparent;}
.navitem:hover{background:rgba(255,255,255,.06);}
.navitem.active{background:rgba(255,255,255,.10);border-left-color:#6EA8FF;color:#fff;font-weight:600;}
.sidebar .userbox{border-top:1px solid rgba(255,255,255,.08);padding:12px 18px;font-size:12px;color:#b9c5dd;}
.sidebar .userbox b{color:#fff;display:block;font-size:13px;}
.sidebar .userbox button{margin-top:8px;background:rgba(255,255,255,.08);border:none;color:#fff;
  padding:6px 10px;border-radius:6px;font-size:11.5px;}

.main{flex:1;min-width:0;display:flex;flex-direction:column;}
.topbar{background:#fff;border-bottom:1px solid var(--border);padding:14px 26px;display:flex;
  align-items:center;justify-content:space-between;}
.topbar h1{font-size:17px;margin:0;color:var(--navy);}
.topbar .role-badge{font-size:11px;font-weight:700;padding:4px 10px;border-radius:20px;}
.role-ADMIN{background:var(--navy);color:#fff;}
.role-USER{background:var(--grey-bg);color:var(--grey);}
.content{padding:22px 26px;flex:1;overflow-y:auto;}

/* ---- Cards / stats ---- */
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin-bottom:20px;}
.stat-card{background:#fff;border:1px solid var(--border);border-radius:10px;padding:14px 16px;}
.stat-card .n{font-size:24px;font-weight:700;color:var(--navy);}
.stat-card .l{font-size:11.5px;color:var(--muted);margin-top:2px;}
.stat-card.attn{border-color:#ecd3ae;background:var(--orange-bg);}
.stat-card.attn .n{color:var(--orange);}

.panel{background:#fff;border:1px solid var(--border);border-radius:10px;padding:18px 20px;margin-bottom:18px;}
.panel h2{font-size:14.5px;margin:0 0 14px;color:var(--navy);}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:18px;}
@media(max-width:900px){.two-col{grid-template-columns:1fr;}}

.bar-row{display:flex;align-items:center;gap:10px;margin-bottom:9px;font-size:12.5px;}
.bar-row .label{width:150px;flex-shrink:0;color:var(--muted);}
.bar-track{flex:1;background:var(--bg);border-radius:5px;height:9px;overflow:hidden;}
.bar-fill{height:100%;border-radius:5px;background:var(--navy-light);}
.bar-row .val{width:34px;text-align:right;font-weight:600;color:var(--text);}

/* ---- Toolbar / table ---- */
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:14px;}
.toolbar input[type=text],.toolbar select{padding:8px 10px;border:1px solid var(--border);border-radius:7px;background:#fff;}
.toolbar input[type=text]{min-width:220px;}
.spacer{flex:1;}
.btn{border:1px solid var(--border);background:#fff;padding:8px 14px;border-radius:7px;font-size:13px;font-weight:600;color:var(--text);}
.btn:hover{background:#F4F6F9;}
.btn.primary{background:var(--navy);border-color:var(--navy);color:#fff;}
.btn.primary:hover{background:var(--navy-light);}
.btn.danger{color:var(--red);border-color:#f0c7c1;}
.btn.danger:hover{background:var(--red-bg);}
.btn.sm{padding:5px 10px;font-size:12px;}
.btn:disabled{opacity:.45;cursor:not-allowed;}

table.data{width:100%;border-collapse:collapse;background:#fff;font-size:13px;}
table.data th{background:#F7F9FC;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.03em;
  text-align:left;padding:9px 10px;border-bottom:2px solid var(--border);white-space:nowrap;}
table.data td{padding:9px 10px;border-bottom:1px solid var(--border);vertical-align:top;}
table.data tr:hover td{background:#FAFBFD;}
.table-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:10px;background:#fff;}
.cell-actions{display:flex;gap:6px;white-space:nowrap;}
.muted{color:var(--muted);}
.small{font-size:11.5px;}
.pager{display:flex;align-items:center;gap:10px;margin-top:12px;font-size:12.5px;color:var(--muted);}

/* ---- badges ---- */
.badge{display:inline-block;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:700;white-space:nowrap;}
.b-MASIH_DIGUNAKAN{background:var(--green-bg);color:var(--green);}
.b-ROSAK{background:var(--red-bg);color:var(--red);}
.b-ROSAK_MASIH_DIGUNAKAN{background:var(--orange-bg);color:var(--orange);}
.b-CADANG_LUPUS{background:var(--orange-bg);color:var(--orange);}
.b-LUPUS{background:var(--grey-bg);color:var(--grey);}
.b-DIPINJAM{background:var(--blue-bg);color:var(--blue);}
.b-DIPINDAHKAN{background:var(--purple-bg);color:var(--purple);}
.b-PERLU_SEMAKAN{background:var(--orange-bg);color:var(--orange);}
.b-DEFAULT{background:var(--grey-bg);color:var(--grey);}

/* workflow chip row */
.flow{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin:10px 0 4px;}
.flow .step{font-size:11px;padding:4px 10px;border-radius:20px;background:var(--grey-bg);color:var(--muted);font-weight:600;}
.flow .step.done{background:var(--green-bg);color:var(--green);}
.flow .step.current{background:var(--navy);color:#fff;}
.flow .arrow{color:var(--border);font-size:12px;}

/* ---- modal ---- */
.overlay{position:fixed;inset:0;background:rgba(15,23,42,.45);display:flex;align-items:flex-start;
  justify-content:center;padding:36px 16px;overflow-y:auto;z-index:50;}
.modal{background:#fff;border-radius:12px;width:100%;max-width:640px;box-shadow:0 25px 60px rgba(0,0,0,.3);}
.modal.wide{max-width:860px;}
.modal-head{display:flex;align-items:center;justify-content:space-between;padding:16px 22px;border-bottom:1px solid var(--border);}
.modal-head h3{margin:0;font-size:15.5px;color:var(--navy);}
.modal-close{background:none;border:none;font-size:20px;color:var(--muted);line-height:1;}
.modal-body{padding:20px 22px;max-height:70vh;overflow-y:auto;}
.modal-foot{padding:14px 22px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:8px;}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
.form-grid.single{grid-template-columns:1fr;}
.field{display:flex;flex-direction:column;gap:5px;}
.field.span2{grid-column:1/-1;}
.field label{font-size:12px;font-weight:600;color:var(--muted);}
.field label .req{color:var(--red);}
.field input,.field select,.field textarea{padding:8px 10px;border:1px solid var(--border);border-radius:7px;width:100%;}
.field textarea{resize:vertical;min-height:60px;}
.field .hint{font-size:10.5px;color:var(--muted);}

/* detail view */
.dl{display:grid;grid-template-columns:170px 1fr;gap:8px 14px;font-size:13px;}
.dl dt{color:var(--muted);}
.dl dd{margin:0;}
.section-title{font-size:12.5px;font-weight:700;color:var(--navy);text-transform:uppercase;letter-spacing:.03em;
  margin:20px 0 8px;padding-top:14px;border-top:1px solid var(--border);}
.section-title:first-of-type{border-top:none;margin-top:4px;padding-top:0;}
.empty{color:var(--muted);font-size:12.5px;padding:14px 0;text-align:center;}

.toast-wrap{position:fixed;top:18px;right:18px;z-index:100;display:flex;flex-direction:column;gap:8px;}
.toast{background:var(--navy-dark);color:#fff;padding:10px 16px;border-radius:8px;font-size:13px;box-shadow:0 8px 20px rgba(0,0,0,.25);}
.toast.err{background:var(--red);}
.toast.ok{background:var(--green);}

.banner{background:#FFF6E5;border:1px solid #F0DFAF;color:#7A5B10;padding:10px 14px;border-radius:8px;font-size:12.5px;margin-bottom:16px;}
.thumb{width:38px;height:38px;border-radius:6px;object-fit:cover;border:1px solid var(--border);}
.doc-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px;margin-top:8px;}
.doc-item{border:1px solid var(--border);border-radius:8px;padding:6px;text-align:center;font-size:10.5px;background:#fafbfd;}
.doc-item img{width:100%;height:70px;object-fit:cover;border-radius:5px;margin-bottom:4px;}

/* ---- Responsive / mobile ---- */
.hamburger{display:none;background:none;border:none;font-size:22px;color:var(--navy);cursor:pointer;padding:2px 6px;line-height:1;}
.sidebar-backdrop{display:none;}
@media(max-width:860px){
  .hamburger{display:inline-block;}
  .shell{position:relative;overflow-x:hidden;}
  .sidebar{position:fixed;top:0;left:0;bottom:0;z-index:60;width:250px;max-width:80vw;
    transform:translateX(-100%);transition:transform .22s ease;box-shadow:0 0 30px rgba(0,0,0,.35);}
  .sidebar.open{transform:translateX(0);}
  .sidebar-backdrop{display:none;position:fixed;inset:0;background:rgba(15,23,42,.45);z-index:55;}
  .sidebar-backdrop.show{display:block;}
  .main{width:100%;min-width:0;}
  .topbar{padding:12px 14px;}
  .topbar h1{font-size:15px;}
  .topbar-left{display:flex;align-items:center;gap:6px;min-width:0;}
  .topbar-left h1{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .content{padding:14px;}
  .stat-grid{grid-template-columns:repeat(2,1fr);gap:10px;}
  .stat-card .n{font-size:20px;}
  .panel{padding:14px;}
  .form-grid{grid-template-columns:1fr!important;}
  .dl{grid-template-columns:1fr!important;gap:2px 0;}
  .dl dt{margin-top:10px;font-weight:600;color:var(--text);}
  .dl dd{color:var(--muted);margin-bottom:2px;}
  .modal,.modal.wide{max-width:100%;width:100%;border-radius:10px;}
  .overlay{padding:0;align-items:stretch;}
  .overlay .modal{margin:auto 0 0;max-height:92vh;display:flex;flex-direction:column;border-radius:14px 14px 0 0;}
  .modal-body{max-height:none;flex:1;overflow-y:auto;}
  .toolbar{gap:6px;}
  .toolbar input[type=text]{min-width:0;flex:1 1 100%;}
  .toolbar select{flex:1 1 47%;}
  .spacer{flex-basis:100%;height:0;}
  table.data{font-size:12px;}
  table.data th,table.data td{padding:7px 8px;}
  .login-card{width:100%;max-width:360px;padding:26px 20px;}
  .cell-actions{flex-wrap:wrap;}
}
@media(max-width:480px){
  .stat-grid{grid-template-columns:1fr 1fr;}
  .login-wrap{padding:16px;}
}

</style>
</head>

function esc(s){
  if(s===undefined||s===null) return "";
  return String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

function csvEscape(v){
  v = (v===undefined||v===null) ? "" : String(v);
  if(/[",\n]/.test(v)) return '"' + v.replace(/"/g,'""') + '"';
  return v;
}
function downloadCSV(filename, headers, rows){
  const lines = [headers.map(csvEscape).join(",")];
  rows.forEach(r => lines.push(r.map(csvEscape).join(",")));
  const blob = new Blob(["\uFEFF" + lines.join("\r\n")], {type:"text/csv;charset=utf-8;"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

  return data;
}

}

  const p = DB.personnel.find(x=>x.id===id);
  return p ? p.nama : (id||"\u2014");

/* ---------------- Load & refresh ---------------- */
async function loadAll(){
  const data = await apiGet({action:"listAll"});
  COLLECTIONS.forEach(c => { if(data[c]) DB[c] = data[c]; });
}
async function refreshCollection(name){
  const r = await apiGet({action:"list", collection:name});
  DB[name] = r.data || [];
}

async function doLogin(email, password){
  const res = await apiPost({action:"login", email, password});
  STATE.token = res.token;
  STATE.user = res.user;
}
function doLogout(){
  STATE.token = null;
  STATE.user = null;
  STATE.view = "dashboard";
  STATE.modal = null;
  STATE.assetFilter = { q:"", status:"", kategori:"", lokasi:"" };
  STATE.assetPage = 1;
  COLLECTIONS.forEach(c => DB[c] = []);
  render();
}

async function init(){
  STATE.loading = true; render();
  if(!API_URL || API_URL.indexOf("PASTE_") === 0){
    STATE.configMissing = true; STATE.loading = false; render(); return;
  }
  STATE.loading = false;
  render();
}
/* ---------------- Root render ---------------- */
function render(){
  const root = document.getElementById("app");
  if(STATE.loading){
    root.innerHTML = `<div class="login-wrap"><div class="login-card" style="text-align:center;">
      <h1>Memuatkan\u2026</h1><div class="sub">Sila tunggu sebentar</div></div></div>`;
    return;
  }
  if(STATE.configMissing){ root.innerHTML = renderConfigMissing(); return; }
  if(!STATE.user){ root.innerHTML = renderLogin(); bindLoginEvents(); return; }
  root.innerHTML = renderShell();
  bindShellEvents();
  renderToasts();
}
function renderToasts(){
  let wrap = document.getElementById("toastWrap");
  if(!wrap){ wrap = document.createElement("div"); wrap.id = "toastWrap"; wrap.className = "toast-wrap"; document.body.appendChild(wrap); }
  wrap.innerHTML = STATE.toasts.map(t=>`<div class="toast ${t.kind==='err'?'err':(t.kind==='info'?'':'ok')}">${esc(t.msg)}</div>`).join("");
}

function renderLogin(){
  return `
  <div class="login-wrap">
    <div class="login-card">
      <h1>Sistem Pengurusan Aset Alih</h1>
      <div class="sub">Seksyen Biokimia \u2014 Institut Penyelidikan Veterinar, Ipoh</div>
      <label>E-mel</label>
      <input type="email" id="loginEmail" placeholder="nama@organisasi.gov.my" autocomplete="username"/>
      <label>Kata Laluan</label>
      <input type="password" id="loginPassword" placeholder="Masukkan kata laluan" autocomplete="current-password"/>
      <button class="primary" id="loginBtn">Log Masuk</button>
      <div id="loginError"></div>
    </div>
  </div>`;
}
function bindLoginEvents(){
  document.getElementById("loginBtn").onclick = handleLoginSubmit;
  document.getElementById("loginPassword").addEventListener("keydown", e=>{ if(e.key==="Enter") handleLoginSubmit(); });
}
async function handleLoginSubmit(){
  const email = document.getElementById("loginEmail").value.trim();
  const password = document.getElementById("loginPassword").value;
  const errEl = document.getElementById("loginError");
  const btn = document.getElementById("loginBtn");
  if(!email || !password){ errEl.innerHTML = `<div class="login-err">Sila masukkan e-mel dan kata laluan.</div>`; return; }
  btn.disabled = true; btn.textContent = "Sedang menyemak\u2026";
  try{
    await doLogin(email, password);
    STATE.loading = true; render();
    await loadAll();
    STATE.loading = false;
    render();
  }catch(err){
    errEl.innerHTML = `<div class="login-err">${esc(err.message||"Gagal log masuk.")}</div>`;
    btn.disabled = false; btn.textContent = "Log Masuk";
  }
}

/* ---------------- Dashboard ---------------- */
function renderDashboard(){
  const assets = DB.assets;
  const total = assets.length;
  const byStatus = {};
  STATUS_LIST.forEach(s=>byStatus[s]=0);
  assets.forEach(a=>{ byStatus[a.status] = (byStatus[a.status]||0)+1; });
  const byCat = {};
  assets.forEach(a=>{ byCat[a.kategori] = (byCat[a.kategori]||0)+1; });
  const byLoc = {};
  assets.forEach(a=>{ byLoc[a.lokasi] = (byLoc[a.lokasi]||0)+1; });
  const needAttention = assets.filter(a=>a.perluSelenggara==="YA" && (a.tahunSelenggara==="Tiada Rekod"||!a.tahunSelenggara)).length;
  const openDamage = DB.damage.filter(d=>d.status!=="Ditutup").length;
  const activeLoans = DB.movements.filter(m=>m.status==="Dalam Pergerakan").length;

  const catRows = Object.entries(byCat).sort((a,b)=>b[1]-a[1]);
  const locRows = Object.entries(byLoc).sort((a,b)=>b[1]-a[1]).slice(0,8);
  const maxCat = Math.max(...catRows.map(r=>r[1]),1);
  const maxLoc = Math.max(...locRows.map(r=>r[1]),1);

  if(total === 0){
    return `<div class="banner">Google Sheet masih kosong. ${STATE.user.role==="ADMIN" ? 'Pergi ke <b>Tetapan Pengguna</b> untuk import data aset awal.' : 'Sila hubungi Admin untuk import data aset awal.'}</div>`;
  }

  const recentAudit = (DB.auditLog||[]).slice(0,6);

  return `
  <div class="stat-grid">
    <div class="stat-card"><div class="n">${total}</div><div class="l">Jumlah Keseluruhan Aset</div></div>
    <div class="stat-card"><div class="n">${byStatus["MASIH DIGUNAKAN"]}</div><div class="l">Aset Aktif Digunakan</div></div>
    <div class="stat-card"><div class="n">${(byStatus["ROSAK"]||0)+(byStatus["ROSAK (MASIH DIGUNAKAN)"]||0)}</div><div class="l">Aset Rosak</div></div>
    <div class="stat-card"><div class="n">${byStatus["CADANG LUPUS"]}</div><div class="l">Cadang Pelupusan</div></div>
    <div class="stat-card"><div class="n">${byStatus["LUPUS"]}</div><div class="l">Telah Dilupuskan</div></div>
    <div class="stat-card"><div class="n">${activeLoans}</div><div class="l">Sedang Dipinjam</div></div>
    <div class="stat-card"><div class="n">${openDamage}</div><div class="l">Aduan Kerosakan Aktif</div></div>
    <div class="stat-card attn"><div class="n">${needAttention}</div><div class="l">Perlu Selenggara &amp; Tiada Rekod</div></div>
  </div>

  <div class="two-col">
    <div class="panel">
      <h2>Aset Mengikut Kategori</h2>
      ${catRows.map(([k,v])=>`
        <div class="bar-row"><div class="label">${esc(k)}</div>
          <div class="bar-track"><div class="bar-fill" style="width:${(v/maxCat*100).toFixed(0)}%"></div></div>
          <div class="val">${v}</div></div>`).join("")}
    </div>
    <div class="panel">
      <h2>Aset Mengikut Lokasi (Top 8)</h2>
      ${locRows.map(([k,v])=>`
        <div class="bar-row"><div class="label" title="${esc(k)}">${esc(k)}</div>
          <div class="bar-track"><div class="bar-fill" style="width:${(v/maxLoc*100).toFixed(0)}%;background:var(--green);"></div></div>
          <div class="val">${v}</div></div>`).join("")}
    </div>
  </div>

  ${STATE.user.role==="ADMIN" ? `
  <div class="panel">
    <h2>Aktiviti Terkini (Audit Trail)</h2>
    ${recentAudit.length ? `<div class="table-wrap"><table class="data"><thead><tr>
      <th>Masa</th><th>Pengguna</th><th>Tindakan</th><th>Koleksi</th><th>Butiran</th></tr></thead><tbody>
      ${recentAudit.map(l=>`<tr><td class="small muted">${esc(l.tsDisplay)}</td><td>${esc(l.user)}</td>
        <td>${esc(l.action)}</td><td>${esc(l.collection)}</td><td>${esc(l.summary)}</td></tr>`).join("")}
      </tbody></table></div>` : `<div class="empty">Tiada aktiviti direkodkan lagi.</div>`}
  </div>` : ""}
  `;
}
/* ---------------- Assets module ---------------- */
const ASSET_PAGE_SIZE = 25;

function filteredAssets(){
  const f = STATE.assetFilter;
  return DB.assets.filter(a=>{
    if(f.status && a.status!==f.status) return false;
    if(f.kategori && a.kategori!==f.kategori) return false;
    if(f.lokasi && a.lokasi!==f.lokasi) return false;
    if(f.q){
      const q = f.q.toLowerCase();
      const hay = (a.noSiri+" "+a.nama+" "+a.lokasi+" "+a.kategori).toLowerCase();
      if(!hay.includes(q)) return false;
    }
    return true;
  });
}

function renderAssets(){
  const all = filteredAssets();
  const totalPages = Math.max(1, Math.ceil(all.length / ASSET_PAGE_SIZE));
  if(STATE.assetPage > totalPages) STATE.assetPage = totalPages;
  const start = (STATE.assetPage-1)*ASSET_PAGE_SIZE;
  const pageRows = all.slice(start, start+ASSET_PAGE_SIZE);
  const f = STATE.assetFilter;
  const isAdmin = STATE.user.role==="ADMIN";

  const statusOpts = STATUS_LIST.map(s=>`<option value="${esc(s)}" ${f.status===s?'selected':''}>${esc(s)}</option>`).join("");
  const catOpts = DB.categories.map(c=>`<option value="${esc(c.nama)}" ${f.kategori===c.nama?'selected':''}>${esc(c.nama)}</option>`).join("");
  const locOpts = DB.locations.map(l=>`<option value="${esc(l.nama)}" ${f.lokasi===l.nama?'selected':''}>${esc(l.nama)}</option>`).join("");

  return `
  <div class="toolbar">
    <input type="text" id="assetSearch" placeholder="Cari no. siri, nama, lokasi\u2026" value="${esc(f.q)}"/>
    <select id="assetStatusFilter"><option value="">Semua Status</option>${statusOpts}</select>
    <select id="assetCatFilter"><option value="">Semua Kategori</option>${catOpts}</select>
    <select id="assetLocFilter"><option value="">Semua Lokasi</option>${locOpts}</select>
    <div class="spacer"></div>
    <button class="btn" id="exportAssetsCsv">Eksport CSV</button>
    ${isAdmin ? `<button class="btn primary" id="addAssetBtn">+ Daftar Aset Baharu</button>` : ""}
  </div>
  <div class="small muted" style="margin-bottom:8px;">Menunjukkan ${pageRows.length} daripada ${all.length} aset (jumlah keseluruhan: ${DB.assets.length})</div>
  <div class="table-wrap"><table class="data"><thead><tr>
    <th>No. Siri Pendaftaran</th><th>Nama Aset</th><th>Kategori</th><th>Lokasi</th><th>Status</th><th>Semakan Terakhir</th><th></th>
  </tr></thead><tbody>
    ${pageRows.map(a=>`
      <tr>
        <td class="small">${esc(a.noSiri)||'\u2014'}</td>
        <td>${esc((a.nama||'').slice(0,90))}</td>
        <td class="small">${esc(a.kategori)}</td>
        <td class="small">${esc(a.lokasi)}</td>
        <td><span class="${badgeClass(a.status)}">${esc(a.status)}</span></td>
        <td class="small muted">${fmtDate(a.tarikhSemakan)}</td>
        <td class="cell-actions">
          <button class="btn sm" data-view-asset="${a.id}">Lihat</button>
          ${isAdmin ? `<button class="btn sm" data-edit-asset="${a.id}">Edit</button>` : ""}
        </td>
      </tr>`).join("")}
  </tbody></table></div>
  <div class="pager">
    <button class="btn sm" id="assetPrev" ${STATE.assetPage<=1?'disabled':''}>&larr; Sebelum</button>
    <span>Muka surat ${STATE.assetPage} / ${totalPages}</span>
    <button class="btn sm" id="assetNext" ${STATE.assetPage>=totalPages?'disabled':''}>Seterus &rarr;</button>
  </div>
  `;
}

function bindAssetsEvents(){
  const q = document.getElementById("assetSearch");
  q.oninput = ()=>{ STATE.assetFilter.q = q.value; STATE.assetPage=1; render(); q2focus(); };
  document.getElementById("assetStatusFilter").onchange = e=>{ STATE.assetFilter.status=e.target.value; STATE.assetPage=1; render(); };
  document.getElementById("assetCatFilter").onchange = e=>{ STATE.assetFilter.kategori=e.target.value; STATE.assetPage=1; render(); };
  document.getElementById("assetLocFilter").onchange = e=>{ STATE.assetFilter.lokasi=e.target.value; STATE.assetPage=1; render(); };
  document.getElementById("assetPrev").onclick = ()=>{ STATE.assetPage--; render(); };
  document.getElementById("assetNext").onclick = ()=>{ STATE.assetPage++; render(); };
  document.getElementById("exportAssetsCsv").onclick = ()=>{
    const rows = filteredAssets().map(a=>[a.id,a.noSiri,a.nama,a.kategori,a.lokasi,a.kodPenempatan,a.status,a.tarikhPenempatan,a.tarikhSemakan,a.perluSelenggara,a.tahunSelenggara,a.catatan]);
    downloadCSV("senarai_aset.csv", ["ID","No Siri Pendaftaran","Nama Aset","Kategori","Lokasi","Kod Penempatan","Status","Tarikh Penempatan","Tarikh Semakan","Perlu Selenggara","Tahun Selenggara Terakhir","Catatan"], rows);
  };
  const addBtn = document.getElementById("addAssetBtn");
  if(addBtn) addBtn.onclick = ()=>{ openAssetForm(null); };
  document.querySelectorAll("[data-view-asset]").forEach(el=>{
    el.onclick = ()=> openAssetDetail(el.getAttribute("data-view-asset"));
  });
  document.querySelectorAll("[data-edit-asset]").forEach(el=>{
    el.onclick = ()=> openAssetForm(el.getAttribute("data-edit-asset"));
  });
}
function q2focus(){
  const el = document.getElementById("assetSearch");
  if(el){ const v = el.value; el.focus(); el.setSelectionRange(v.length, v.length); }
}

  const dmg = DB.damage.filter(m=>m.assetId===id).sort((x,y)=>(y.tarikhLapor||"").localeCompare(x.tarikhLapor||""));
  const mov = DB.movements.filter(m=>m.assetId===id).sort((x,y)=>(y.tarikhKeluar||"").localeCompare(x.tarikhKeluar||""));
  const insp = DB.inspections.filter(m=>m.assetId===id).sort((x,y)=>(y.tarikh||"").localeCompare(x.tarikh||""));
  const disp = DB.disposals.filter(m=>m.assetId===id).sort((x,y)=>(y.tarikhCadangan||"").localeCompare(x.tarikhCadangan||""));

        <div class="doc-item">${d.url?`<img src="${esc(d.url)}"/>`:''}<div>${esc(d.nama)}</div></div>`).join("")}</div>`
        : `<div class="empty">Tiada dokumen dimuat naik.</div>`}

async function saveAssetForm(id){
  const form = document.getElementById("assetForm");
  const fd = new FormData(form);
  const nama = fd.get("nama").trim();
  const kategori = fd.get("kategori");
  const lokasi = fd.get("lokasi");
  if(!nama || !kategori || !lokasi){ toast("Sila lengkapkan medan wajib (*).", "err"); return; }
  const payload = {
    noSiri: fd.get("noSiri").trim(), nama, kategori, lokasi,
    kodPenempatan: fd.get("kodPenempatan").trim(), status: fd.get("status"),
    tarikhPenempatan: fd.get("tarikhPenempatan"), perluSelenggara: fd.get("perluSelenggara"),
    tarikhSemakan: fd.get("tarikhSemakan"), tahunSelenggara: fd.get("tahunSelenggara").trim(),
    catatan: fd.get("catatan").trim(),
  };
  const saveBtn = document.getElementById("assetFormSave");
  if(saveBtn){ saveBtn.disabled = true; saveBtn.textContent = "Menyimpan\u2026"; }
  try{
    if(id){
      const res = await apiPost({action:"update", collection:"assets", id, record: payload});
      const idx = DB.assets.findIndex(a=>a.id===id);
      if(idx>=0) DB.assets[idx] = res.record;
      toast("Aset dikemaskini.");
    } else {
      const res = await apiPost({action:"create", collection:"assets", record: payload});
      DB.assets.unshift(res.record);
      toast("Aset baharu didaftarkan.");
    }
    STATE.modal = null;
    STATE.assetPage = 1;
    render();
  }catch(err){
    toast("Gagal simpan: "+err.message, "err");
    if(saveBtn){ saveBtn.disabled = false; saveBtn.textContent = id?"Simpan Perubahan":"Daftar Aset"; }
  }
}

function fieldInputHtml(f, val){
  const req = f.required ? "required" : "";
  if(f.type==="asset"){
    const chosen = findAsset(val);
    return `<input type="text" list="assetDatalist" name="${f.key}" data-field-type="asset"
      value="${chosen? esc(assetLabel(chosen)+' ['+chosen.id+']') : ''}" placeholder="Taip untuk cari no. siri / nama aset\u2026" ${req}/>`;
  }
  if(f.type==="personnel"){
    const chosen = DB.personnel.find(p=>p.id===val);
    return `<input type="text" list="personnelDatalist" name="${f.key}" data-field-type="personnel"
      value="${chosen? esc(personnelLabel(chosen)+' ['+chosen.id+']') : ''}" placeholder="Taip nama pegawai\u2026" ${req}/>`;
  }
  if(f.type==="select"){
    return `<select name="${f.key}" ${req}>${f.options.map(o=>`<option value="${esc(o)}" ${val===o?'selected':''}>${esc(o)}</option>`).join("")}</select>`;
  }
  if(f.type==="textarea"){
    return `<textarea name="${f.key}" ${req}>${esc(val||"")}</textarea>`;
  }
  if(f.type==="date"){
    return `<input type="date" name="${f.key}" value="${esc(val||"")}" ${req}/>`;
  }
  if(f.type==="number"){
    return `<input type="number" step="0.01" name="${f.key}" value="${esc(val!==undefined&&val!==null?val:"")}" ${req}/>`;
  }
  return `<input type="text" name="${f.key}" value="${esc(val||"")}" ${req}/>`;
}

}
function personnelDatalistHtml(){
  return `<datalist id="personnelDatalist">${DB.personnel.map(p=>`<option value="${esc(personnelLabel(p)+' ['+p.id+']')}"></option>`).join("")}</datalist>`;
}
function parseBracketId(text){
  const m = /\[([A-Za-z0-9\-]+)\]\s*$/.exec(text||"");
  return m ? m[1] : null;
}

async function saveGenericForm(key, id){
  const cfg = MODULE_CONFIG[key];
  const form = document.getElementById("genericForm");
  const fd = new FormData(form);
  const payload = {};
  for(const f of cfg.fields){
    let v = fd.get(f.key);
    if(f.type==="asset"){
      const parsedId = parseBracketId(v);
      if(f.required && !parsedId){ toast("Sila pilih aset yang sah daripada senarai.", "err"); return; }
      v = parsedId || "";
    } else if(f.type==="personnel"){
      v = parseBracketId(v) || "";
    } else if(f.type==="text" || f.type==="textarea"){
      v = (v||"").trim();
      if(f.required && !v){ toast(`Sila isi medan: ${f.label}`, "err"); return; }
    } else if(f.required && !v){
      toast(`Sila isi medan: ${f.label}`, "err"); return;
    }
    payload[f.key] = v;
  }
  const saveBtn = document.getElementById("genericFormSave");
  if(saveBtn){ saveBtn.disabled = true; saveBtn.textContent = "Menyimpan\u2026"; }
  try{
    if(id){
      const res = await apiPost({action:"update", collection:key, id, record: payload});
      const idx = DB[cfg.collection].findIndex(r=>r.id===id);
      if(idx>=0) DB[cfg.collection][idx] = res.record;
      toast("Rekod dikemaskini.");
    } else {
      if(cfg.flow) payload.status = cfg.flow[0];
      const res = await apiPost({action:"create", collection:key, record: payload});
      DB[cfg.collection].unshift(res.record);
      toast("Rekod ditambah.");
    }
    STATE.modal = null;
    render();
  }catch(err){
    toast("Gagal simpan: "+err.message, "err");
    if(saveBtn){ saveBtn.disabled = false; saveBtn.textContent = id?"Simpan Perubahan":"Tambah Rekod"; }
  }
}

      const cls = i<curIdx ? "done" : (i===curIdx ? "current" : "");
      return `<span class="step ${cls}">${esc(s)}</span>` + (i<cfg.flow.length-1?`<span class="arrow">&rarr;</span>`:"");
    }).join("")}</div>`;
    if(cfg.note) flowHtml += `<div class="small muted" style="margin:4px 0 8px;">${cfg.note}</div>`;
    if(isAdmin && curIdx < cfg.flow.length-1){
      const next = cfg.flow[curIdx+1];
      flowHtml += `<button class="btn sm primary" id="advanceFlowBtn" data-key="${key}" data-id="${id}" data-next="${esc(next)}">
        Majukan ke: ${esc(next)}</button>`;
    }
  }

  return `
  <div class="modal">
    <div class="modal-head"><h3>${cfg.title}</h3><button class="modal-close" data-close-modal>&times;</button></div>
    <div class="modal-body">
      ${asset ? `<div class="small muted" style="margin-bottom:10px;">Aset: <b>${esc(assetLabel(asset))}</b>

      ${flowHtml}
      <dl class="dl" style="margin-top:14px;">
        ${cfg.fields.filter(f=>f.type!=="asset").map(f=>{
          let v = rec[f.key];
          if(f.type==="personnel") v = personnelNameById(v) || "\u2014";
          return `<dt>${f.label}</dt><dd>${esc(v)||'\u2014'}</dd>`;
        }).join("")}
      </dl>
    </div>
    <div class="modal-foot">
      ${isAdmin ? `<button class="btn" data-edit-generic="${key}" data-id="${id}" data-close-modal>Edit</button>` : ""}
      <button class="btn primary" data-close-modal>Tutup</button>
    </div>
  </div>`;
}
async function advanceFlow(key, id, next){
  if(!requireAdmin()) return;
  const cfg = MODULE_CONFIG[key];
  const btn = document.getElementById("advanceFlowBtn");
  if(btn){ btn.disabled = true; btn.textContent = "Mengemaskini\u2026"; }
  try{
    const res = await apiPost({action:"advanceStatus", collection:key, id, status: next});
    const idx = DB[cfg.collection].findIndex(r=>r.id===id);
    if(idx>=0) DB[cfg.collection][idx] = res.record;

      await refreshCollection("assets"); // pelayan turut menukar status aset berkaitan ke LUPUS

    STATE.modal = {type:"genericDetail", key, id};
    render();

    toast("Gagal kemaskini status: "+err.message, "err");

async function deleteSimpleRecord(key, id){
  if(!requireAdmin()) return;
  const cfg = SIMPLE_CONFIG[key];
  const inUse = cfg.usageCheck ? cfg.usageCheck(id) : 0;
  if(inUse > 0){ toast(`Tidak boleh padam \u2014 ${inUse} aset masih rujuk rekod ini.`, "err"); return; }
  if(!confirm("Padam rekod ini?")) return;
  try{
    await apiPost({action:"delete", collection:key, id});
    DB[cfg.collection] = DB[cfg.collection].filter(r=>r.id!==id);
    toast("Rekod dipadam.");

  }catch(err){ toast("Gagal padam: "+err.message, "err"); }

async function saveSimpleForm(key, id){
  const cfg = SIMPLE_CONFIG[key];
  const form = document.getElementById("simpleForm");
  const fd = new FormData(form);
  const payload = {};
  for(const f of cfg.fields){
    let v = (fd.get(f.key)||"").trim();
    if(f.required && !v){ toast(`Sila isi medan: ${f.label}`, "err"); return; }
    payload[f.key] = v;
  }
  const saveBtn = document.getElementById("simpleFormSave");
  if(saveBtn){ saveBtn.disabled = true; saveBtn.textContent = "Menyimpan\u2026"; }
  try{
    if(id){
      const res = await apiPost({action:"update", collection:key, id, record: payload});
      const idx = DB[cfg.collection].findIndex(r=>r.id===id);
      if(idx>=0) DB[cfg.collection][idx] = res.record;
      toast("Dikemaskini.");
    } else {
      const res = await apiPost({action:"create", collection:key, record: payload});
      DB[cfg.collection].push(res.record);
      toast("Ditambah.");
    }
    STATE.modal = null;
    render();
  }catch(err){
    toast("Gagal simpan: "+err.message, "err");
    if(saveBtn){ saveBtn.disabled = false; saveBtn.textContent = id?"Simpan":"Tambah"; }
  }
}

    render();
  }catch(err){
    toast("Gagal simpan: "+err.message, "err");
    if(saveBtn){ saveBtn.disabled = false; saveBtn.textContent = id?"Simpan":"Tambah"; }
  }
}

/* ---------------- Modal dispatcher ---------------- */
function renderModal(){
  const m = STATE.modal;
  let inner = "";
  if(m.type==="assetDetail") inner = renderAssetDetailModal(m.id);
  else if(m.type==="assetForm") inner = renderAssetFormModal(m.id);
  else if(m.type==="genericForm") inner = renderGenericFormModal(m.key, m.id);
  else if(m.type==="genericDetail") inner = renderGenericDetailModal(m.key, m.id);
  else if(m.type==="simpleForm") inner = renderSimpleFormModal(m.key, m.id);
  else if(m.type==="userForm") inner = renderUserFormModal(m.id);
  return `<div class="overlay" id="modalOverlay">${inner}</div>`;
}
function bindModalEvents(){
  const overlay = document.getElementById("modalOverlay");
  if(overlay) overlay.onclick = (e)=>{ if(e.target.id==="modalOverlay"){ STATE.modal=null; render(); } };

  document.querySelectorAll("[data-close-modal]").forEach(el=>{
    const existing = el.onclick;
    el.onclick = (e)=>{ if(existing) existing(e); STATE.modal=null; if(!el.hasAttribute('data-view-asset') && !el.hasAttribute('data-edit-asset')) render(); };
  });
  document.querySelectorAll("[data-view-asset]").forEach(el=>{
    el.onclick = ()=> openAssetDetail(el.getAttribute("data-view-asset"));
  });
  document.querySelectorAll("[data-edit-asset]").forEach(el=>{
    el.onclick = ()=> openAssetForm(el.getAttribute("data-edit-asset"));
  });

  const m = STATE.modal;
  if(m.type==="assetForm"){
    document.getElementById("assetFormSave").onclick = ()=> saveAssetForm(m.id);
  }
  if(m.type==="genericForm"){
    document.getElementById("genericFormSave").onclick = ()=> saveGenericForm(m.key, m.id);
  }
  if(m.type==="genericDetail"){
    const advBtn = document.getElementById("advanceFlowBtn");
    if(advBtn) advBtn.onclick = ()=> advanceFlow(advBtn.getAttribute("data-key"), advBtn.getAttribute("data-id"), advBtn.getAttribute("data-next"));
  }
  if(m.type==="simpleForm"){
    document.getElementById("simpleFormSave").onclick = ()=> saveSimpleForm(m.key, m.id);
  }
  if(m.type==="userForm"){
    document.getElementById("userFormSave").onclick = ()=> saveUserForm(m.id);
  }
  if(m.type==="assetDetail"){
    const uploadBtn = document.getElementById("docUploadBtn");
    if(uploadBtn) uploadBtn.onclick = ()=> handleDocUpload(m.id);
  }
}

function readFileAsDataURL(file){
  return new Promise((resolve,reject)=>{
    const reader = new FileReader();
    reader.onload = ()=> resolve(reader.result);
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}
async function handleDocUpload(assetId){
  const input = document.getElementById("docUpload");
  if(!input.files || !input.files[0]){ toast("Sila pilih fail gambar.", "err"); return; }
  const file = input.files[0];
  if(file.size > 3*1024*1024){ toast("Fail terlalu besar (had 3MB).", "err"); return; }
  const uploadBtn = document.getElementById("docUploadBtn");
  if(uploadBtn){ uploadBtn.disabled = true; uploadBtn.textContent = "Memuat naik\u2026"; }
  try{
    const dataUrl = await readFileAsDataURL(file);
    const res = await apiPost({action:"uploadDocument", assetId, filename:file.name, dataUrl});
    DB.documents.push(res.record);
    toast("Gambar dimuat naik.");
    render();
  }catch(err){
    toast("Gagal muat naik: "+err.message, "err");
    if(uploadBtn){ uploadBtn.disabled = false; uploadBtn.textContent = "Muat Naik Gambar"; }
  }
}

</script>

init();
